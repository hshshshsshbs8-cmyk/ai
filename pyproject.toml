[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aet-dss"
version = "0.1.0"
description = "Sandboxed, auditable trajectory dataset system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "AET-DSS contributors"}]

[project.scripts]
aet-dss = "aet_dss.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
